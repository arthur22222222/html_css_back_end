<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Arthur Games</title>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">🎮 Arthur Games</div>
        <div class="navbar-links">
            <button class="nav-btn active" data-secao="produtos">Jogos</button>
            <button class="nav-btn" data-secao="carrinho">
                Carrinho <span id="carrinhoContador" class="badge">0</span>
            </button>
            <button class="nav-btn" data-secao="login" id="btnLoginNav">Login</button>
            <button class="nav-btn" data-secao="cadastro">Cadastro</button>
        </div>
        <div class="navbar-user" id="navbarUser" style="display:none;">
            <span id="usuarioNome"></span>
            <button id="btnLogout" class="nav-btn logout">Sair</button>
        </div>
    </nav>

    <main>
        <!-- PRODUTOS -->
        <section id="secao-produtos" class="secao">
            <h1>Jogos Online</h1>

            <form id="formFiltrosProdutos" class="filtros-produtos" role="search">
                <div class="filtro-busca">
                    <label for="buscaProduto">Buscar por nome</label>
                    <div class="busca-linha">
                        <input type="search" id="buscaProduto" placeholder="Ex.: Elden Ring, Valorant, Minecraft...">
                        <button type="submit" class="submit-btn btn-pesquisar">Pesquisar</button>
                    </div>
                </div>

                <div class="filtros-linha">
                    <div class="filtro">
                        <label for="categoriaProduto">Categoria</label>
                        <select id="categoriaProduto">
                            <option value="">Todas as categorias</option>
                        </select>
                    </div>

                    <div class="filtro">
                        <label for="precoMin">Preço mínimo</label>
                        <input type="number" id="precoMin" min="0" step="0.01" placeholder="R$ 0,00">
                    </div>

                    <div class="filtro">
                        <label for="precoMax">Preço máximo</label>
                        <input type="number" id="precoMax" min="0" step="0.01" placeholder="R$ 999,00">
                    </div>

                    <div class="filtro">
                        <label for="ordenarProdutos">Ordenar por</label>
                        <select id="ordenarProdutos">
                            <option value="">Padrão</option>
                            <option value="preco_asc">Menor preço</option>
                            <option value="preco_desc">Maior preço</option>
                        </select>
                    </div>

                    <div class="filtro filtro-limpar">
                        <button type="button" id="btnLimparFiltros" class="btn-limpar">Limpar filtros</button>
                    </div>
                </div>
            </form>

            <div id="resumoProdutos" class="resumo-produtos" aria-live="polite"></div>
            <div id="produtosErro" class="error-message" role="alert"></div>
            <div id="listaProdutos" class="grid-produtos"></div>
            <nav id="paginacaoProdutos" class="paginacao" aria-label="Paginação de jogos"></nav>
        </section>

        <!-- CARRINHO -->
        <section id="secao-carrinho" class="secao" hidden>
            <h1>Carrinho</h1>
            <div id="carrinhoVazio" class="aviso" hidden>Seu carrinho está vazio.</div>
            <div id="listaCarrinho"></div>
            <div id="carrinhoTotal" class="carrinho-total"></div>
            <div id="carrinhoPagamento" class="carrinho-pagamento" hidden>
                <label for="formaPagamento">Forma de pagamento</label>
                <select id="formaPagamento" required>
                    <option value="">Selecione...</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão de crédito">Cartão de crédito</option>
                    <option value="Cartão de débito">Cartão de débito</option>
                    <option value="Boleto">Boleto</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
            <div id="carrinhoErro" class="error-message" role="alert"></div>
            <button id="btnFinalizar" class="submit-btn" hidden>Finalizar Compra</button>
        </section>

        <!-- LOGIN -->
        <section id="secao-login" class="secao" hidden>
            <h1>Login</h1>
            <form id="formLogin">
                <label for="loginEmail">E-mail:</label>
                <input type="email" id="loginEmail" required>
                <label for="loginSenha">Senha:</label>
                <input type="password" id="loginSenha" required>
                <span id="loginErro" class="error-message"></span>
                <button type="submit" class="submit-btn">Entrar</button>
            </form>
            <p class="link-secundario">Não tem conta? <a href="#" data-secao="cadastro">Cadastre-se</a></p>
        </section>

        <!-- CADASTRO -->
        <section id="secao-cadastro" class="secao" hidden>
            <h1>Cadastro de Jogadores</h1>
            <form id="formCadastro">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" maxlength="100" required>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                <label for="email">E-mail:</label>
                <input type="email" id="email" maxlength="100" required>
                <label for="celular">Celular:</label>
                <input type="tel" id="celular" placeholder="(99)99999-9999" maxlength="14" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
                <span id="cadastroErro" class="error-message"></span>
                <button type="submit" class="submit-btn">Criar Conta</button>
            </form>
        </section>
    </main>

    <div id="notificacoes" class="notificacoes" aria-live="polite" aria-atomic="false"></div>

    <script src="script.js"></script>
</body>
</html>
