<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Arthur Games</title>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">🎮 Arthur Games</div>
        <div class="navbar-links">
            <button class="nav-btn active" data-secao="produtos">Jogos</button>
            <button class="nav-btn" data-secao="carrinho">
                Carrinho <span id="carrinhoContador" class="badge">0</span>
            </button>
            <button class="nav-btn" data-secao="login" id="btnLoginNav">Login</button>
            <button class="nav-btn" data-secao="cadastro">Cadastro</button>
        </div>
        <div class="navbar-user" id="navbarUser" style="display:none;">
            <div class="menu-usuario" id="menuUsuario">
                <button type="button" class="menu-usuario-btn" id="btnMenuUsuario"
                        aria-haspopup="true" aria-expanded="false" aria-controls="menuUsuarioLista">
                    <span id="usuarioNome"></span>
                    <svg class="menu-usuario-seta" width="12" height="12" viewBox="0 0 24 24"
                         fill="none" aria-hidden="true">
                        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="menu-usuario-lista" id="menuUsuarioLista" hidden>
                    <button type="button" class="menu-usuario-item" id="btnPerfilMenu" data-secao="perfil">
                        <svg class="menu-usuario-icone" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                                  stroke="currentColor" stroke-width="2"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Perfil
                    </button>
                    <button type="button" class="menu-usuario-item sair" id="btnLogout">
                        <svg class="menu-usuario-icone" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
                                  stroke="currentColor" stroke-width="2"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <polyline points="16 17 21 12 16 7" stroke="currentColor" stroke-width="2"
                                      stroke-linecap="round" stroke-linejoin="round"/>
                            <line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="2"
                                  stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Sair
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <!-- PRODUTOS -->
        <section id="secao-produtos" class="secao">
            <h1>Jogos Online</h1>

            <form id="formFiltrosProdutos" class="filtros-produtos" role="search">
                <div class="filtro-busca">
                    <label for="buscaProduto">Buscar por nome</label>
                    <div class="busca-linha">
                        <input type="search" id="buscaProduto" placeholder="Ex.: Elden Ring, Valorant, Minecraft...">
                        <button type="submit" class="submit-btn btn-pesquisar">Pesquisar</button>
                    </div>
                </div>

                <div class="filtros-linha">
                    <div class="filtro">
                        <label for="categoriaProduto">Categoria</label>
                        <select id="categoriaProduto">
                            <option value="">Todas as categorias</option>
                        </select>
                    </div>

                    <div class="filtro">
                        <label for="precoMin">Preço mínimo</label>
                        <input type="number" id="precoMin" min="0" step="0.01" placeholder="R$ 0,00">
                    </div>

                    <div class="filtro">
                        <label for="precoMax">Preço máximo</label>
                        <input type="number" id="precoMax" min="0" step="0.01" placeholder="R$ 999,00">
                    </div>

                    <div class="filtro">
                        <label for="ordenarProdutos">Ordenar por</label>
                        <select id="ordenarProdutos">
                            <option value="">Padrão</option>
                            <option value="preco_asc">Menor preço</option>
                            <option value="preco_desc">Maior preço</option>
                        </select>
                    </div>

                    <div class="filtro filtro-limpar">
                        <button type="button" id="btnLimparFiltros" class="btn-limpar">Limpar filtros</button>
                    </div>
                </div>
            </form>

            <div id="resumoProdutos" class="resumo-produtos" aria-live="polite"></div>
            <div id="produtosErro" class="error-message" role="alert"></div>
            <div id="listaProdutos" class="grid-produtos"></div>
            <nav id="paginacaoProdutos" class="paginacao" aria-label="Paginação de jogos"></nav>
        </section>

        <!-- CARRINHO -->
        <section id="secao-carrinho" class="secao" hidden>
            <h1>Carrinho</h1>
            <div id="carrinhoVazio" class="aviso" hidden>Seu carrinho está vazio.</div>
            <div id="listaCarrinho"></div>
            <div id="carrinhoTotal" class="carrinho-total"></div>
            <div id="carrinhoPagamento" class="carrinho-pagamento" hidden>
                <label for="formaPagamento">Forma de pagamento</label>
                <select id="formaPagamento" required>
                    <option value="">Selecione...</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão de crédito">Cartão de crédito</option>
                    <option value="Cartão de débito">Cartão de débito</option>
                    <option value="Boleto">Boleto</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>
            <div id="carrinhoErro" class="error-message" role="alert"></div>
            <button id="btnFinalizar" class="submit-btn" hidden>Finalizar Compra</button>
        </section>

        <!-- LOGIN -->
        <section id="secao-login" class="secao" hidden>
            <h1>Login</h1>
            <form id="formLogin">
                <label for="loginEmail">E-mail:</label>
                <input type="email" id="loginEmail" required>
                <label for="loginSenha">Senha:</label>
                <input type="password" id="loginSenha" required>
                <span id="loginErro" class="error-message"></span>
                <button type="submit" class="submit-btn">Entrar</button>
            </form>
            <p class="link-secundario">Não tem conta? <a href="#" data-secao="cadastro">Cadastre-se</a></p>
        </section>

        <!-- CADASTRO -->
        <section id="secao-cadastro" class="secao" hidden>
            <h1>Cadastro de Jogadores</h1>
            <form id="formCadastro">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" maxlength="100" required>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                <label for="email">E-mail:</label>
                <input type="email" id="email" maxlength="100" required>
                <label for="celular">Celular:</label>
                <input type="tel" id="celular" placeholder="(99)99999-9999" maxlength="14" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
                <span id="cadastroErro" class="error-message"></span>
                <button type="submit" class="submit-btn">Criar Conta</button>
            </form>
        </section>

        <!-- PERFIL -->
        <section id="secao-perfil" class="secao" hidden>
            <h1>Meu Perfil</h1>

            <div class="perfil-cabecalho">
                <div class="perfil-avatar" id="perfilAvatar" aria-hidden="true">A</div>
                <div class="perfil-identificacao">
                    <p class="perfil-nome" id="perfilNomeExibicao">Seu perfil</p>
                    <p class="perfil-email" id="perfilEmailExibicao"></p>
                </div>
            </div>

            <form id="formPerfil" novalidate>
                <div class="perfil-grid">
                    <div>
                        <label for="perfilNome">Nome completo</label>
                        <input type="text" id="perfilNome" maxlength="100" autocomplete="name" required>
                    </div>
                    <div>
                        <label for="perfilEmail">E-mail</label>
                        <input type="email" id="perfilEmail" maxlength="100" autocomplete="email" required>
                    </div>
                    <div>
                        <label for="perfilCpf">CPF</label>
                        <input type="text" id="perfilCpf" maxlength="14" inputmode="numeric" autocomplete="off" required>
                    </div>
                    <div>
                        <label for="perfilCelular">Celular</label>
                        <input type="tel" id="perfilCelular" maxlength="14" inputmode="tel" autocomplete="tel" required>
                    </div>
                </div>

                <div class="perfil-divisor"></div>

                <h2 class="perfil-subtitulo">Alterar senha</h2>
                <p class="perfil-dica">Preencha os campos abaixo apenas se quiser trocar sua senha.</p>

                <div class="perfil-grid">
                    <div>
                        <label for="perfilSenhaAtual">Senha atual</label>
                        <input type="password" id="perfilSenhaAtual" autocomplete="current-password">
                    </div>
                    <div>
                        <label for="perfilNovaSenha">Nova senha</label>
                        <input type="password" id="perfilNovaSenha" minlength="6" autocomplete="new-password">
                    </div>
                    <div>
                        <label for="perfilConfirmarSenha">Confirmar nova senha</label>
                        <input type="password" id="perfilConfirmarSenha" minlength="6" autocomplete="new-password">
                    </div>
                </div>

                <span id="perfilErro" class="error-message" role="alert"></span>

                <div class="perfil-acoes">
                    <button type="submit" class="submit-btn" id="btnSalvarPerfil">Salvar alterações</button>
                    <button type="button" class="btn-limpar" id="btnCancelarPerfil">Descartar alterações</button>
                </div>
            </form>
        </section>
    </main>

    <div id="notificacoes" class="notificacoes" aria-live="polite" aria-atomic="false"></div>

    <script src="script.js"></script>
</body>
</html>
