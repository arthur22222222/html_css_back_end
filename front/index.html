<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Loja</title>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">🛍️ elthurzito</div>
        <div class="navbar-links">
            <button class="nav-btn active" data-secao="produtos">Produtos</button>
            <button class="nav-btn" data-secao="carrinho">
                Carrinho <span id="carrinhoContador" class="badge">0</span>
            </button>
            <button class="nav-btn" data-secao="login" id="btnLoginNav">Login</button>
            <button class="nav-btn" data-secao="cadastro">Cadastro</button>
        </div>
        <div class="navbar-user" id="navbarUser" style="display:none;">
            <span id="usuarioNome"></span>
            <button id="btnLogout" class="nav-btn logout">Sair</button>
        </div>
    </nav>

    <main>
        <!-- PRODUTOS -->
        <section id="secao-produtos" class="secao">
            <h1>Produtos</h1>
            <div id="produtosErro" class="error-message"></div>
            <div id="listaProdutos" class="grid-produtos"></div>
        </section>

        <!-- CARRINHO -->
        <section id="secao-carrinho" class="secao" hidden>
            <h1>Carrinho</h1>
            <div id="carrinhoVazio" class="aviso" hidden>Seu carrinho está vazio.</div>
            <div id="listaCarrinho"></div>
            <div id="carrinhoTotal" class="carrinho-total"></div>
            <button id="btnFinalizar" class="submit-btn" hidden>Finalizar Compra</button>
        </section>

        <!-- LOGIN -->
        <section id="secao-login" class="secao" hidden>
            <h1>Login</h1>
            <form id="formLogin">
                <label for="loginEmail">E-mail:</label>
                <input type="email" id="loginEmail" required>
                <label for="loginSenha">Senha:</label>
                <input type="password" id="loginSenha" required>
                <span id="loginErro" class="error-message"></span>
                <button type="submit" class="submit-btn">Entrar</button>
            </form>
            <p class="link-secundario">Não tem conta? <a href="#" data-secao="cadastro">Cadastre-se</a></p>
        </section>

        <!-- CADASTRO -->
        <section id="secao-cadastro" class="secao" hidden>
            <h1>Cadastro de Clientes</h1>
            <form id="formCadastro">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
                <label for="email">E-mail:</label>
                <input type="email" id="email" required>
                <label for="celular">Celular:</label>
                <input type="tel" id="celular" placeholder="(99) 99999-9999" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
                <label for="cep">CEP:</label>
                <input type="text" id="cep" placeholder="00000-000" required oninput="pesquisar(this.value)">
                <span id="cepErro" class="error-message"></span>
                <label for="rua">Rua:</label>
                <input type="text" id="rua" required>
                <label for="numero_casa">Numero da Casa:</label>
                <input type="text" id="numero_casa" required>
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" required>
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" required>
                <label for="estado">Estado:</label>
                <input type="text" id="estado" required>
                <label for="dt_nasc">Data de Nascimento:</label>
                <input type="date" id="dt_nasc" required>
                <span id="cadastroErro" class="error-message"></span>
                <button type="submit" class="submit-btn">Enviar Cadastro</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
